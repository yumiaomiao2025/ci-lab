name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main]
  # 👇 【改动 1】加上这一段：当有人向 main 分支发起合并请求 (PR) 时，也唤醒流水线进行代码体检！
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 拉取仓库源码
        uses: actions/checkout@v4

      - name: 📦 安装 pnpm 包管理器
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 配置 Node.js 20 与缓存
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 🔧 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 执行打包构建 (CI 体检核心)
        run: pnpm build

      # 👇 【改动 2】注意看这里的 if 条件！
      # 意思是：如果是提 PR 触发的体检，跑完上面的 build 就到此为止（跳过部署）；
      # 只有真正 push 合并进 main 分支（或手动触发）时，才把 dist 传到你的个人服务器！
      - name: 🚀 部署 dist 到个人云服务器 (CD)
        if: github.event_name != 'pull_request'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          port: 22
          # password: ${{ secrets.SERVER_PASS }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "dist/*"
          target: "/var/www/my-frontend/dist"
          strip_components: 1
          rm: true