name: Frontend CI/CD Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 拉取仓库源码
        uses: actions/checkout@v4

      - name: 📦 安装 pnpm 包管理器
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: 🟢 配置 Node.js 20 与缓存
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: 🔧 安装项目依赖
        run: pnpm install --frozen-lockfile

      - name: 🏗️ 执行打包构建 (Build)
        run: pnpm build

      # ================= 第 2 关新增：自动部署到个人服务器 =================
      - name: 🚀 部署 dist 到个人云服务器
        # 只有推送到 main 分支或手动触发时才部署（防止别人提 PR 时把测试代码发上服务器）
        if: github.ref == 'refs/heads/main'
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}      # 从金库读取服务器 IP
          username: ${{ secrets.SERVER_USER }}  # 从金库读取用户名
          port: 22                              # SSH 默认端口是 22

          # 👇 二选一：如果你在第三步存的是密码，用 password；如果存的是私钥，用 key（把另一行删掉或注释掉）
          password: ${{ secrets.SERVER_PASS }}
          # key: ${{ secrets.SERVER_SSH_KEY }}

          # 传输配置（下面这 3 行非常关键！）
          source: "dist/*"                      # 要上传虚拟机里的哪个目录
          target: "/var/www/my-frontend/dist"   # 上传到个人服务器的哪个目录
          strip_components: 1                   # 【必加防坑参数】剥离外层的 dist 文件夹壳子！
          rm: true                              # 上传前先清空服务器上的旧 dist 目录，防止旧哈希文件堆积