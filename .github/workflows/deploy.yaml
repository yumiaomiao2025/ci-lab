name: Frontend CI/CD Pipeline (Docker Registry)

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 拉取前端源码
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. 安装 pnpm
      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      # 3. 安装依赖并打包出 dist 文件夹
      - name: Install dependencies & Build
        run: |
          pnpm install
          pnpm build

      # 4. 【核心升级】在 GitHub 云端直接构建 Docker 镜像，并推送到腾讯云 TCR
      - name: Build and Push Docker Image to TCR
        run: |
          docker login ccr.ccs.tencentyun.com -u ${{ secrets.TCR_USERNAME }} -p ${{ secrets.TCR_PASSWORD }}
          docker build \
            -t ccr.ccs.tencentyun.com/yuqiu-docker/my-frontend:latest \
            -t ccr.ccs.tencentyun.com/yuqiu-docker/my-frontend:${{ github.sha }} .
          docker push --all-tags ccr.ccs.tencentyun.com/yuqiu-docker/my-frontend

      # 5. 【极致轻量】SSH 通知服务器：直接从腾讯云内网拉取最新镜像并重启容器！
      - name: Pull Image and Run Container on Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # 确保服务器已登录 TCR（防止服务器重启后登录态过期）
            docker login ccr.ccs.tencentyun.com -u ${{ secrets.TCR_USERNAME }} -p ${{ secrets.TCR_PASSWORD }}
            
            # 1. 从腾讯云仓库拉取最新镜像（只拉发生变化的 dist 图层，极快！）
            docker pull ccr.ccs.tencentyun.com/yuqiu-docker/my-frontend:latest
            
            # 2. 销毁旧容器，用最新镜像启动新容器
            docker rm -f my-web || true
            docker run -d --name my-web -p 80:80 ccr.ccs.tencentyun.com/yuqiu-docker/my-frontend:latest
            
            # 3. 自动清理被替换下来的无名 <none> 旧图层，保持服务器硬盘干净
            docker image prune -f